<header>
 <h1 id="title">Cut Board</h1>
 <span class="stat keep">length <b id="len">–</b></span>
 <span class="stat">pauses <b id="gaps">–</b></span>
 <span class="stat">lines <b id="nl">–</b></span>
 <span id="mix" class="warn" hidden>mixed takes: render needs one take</span>
 <span>pause default <select id="gapdef"></select></span>
 <span>speed <select id="speed"></select></span>
 <span title="the pause kept after a comma, a full stop or a list word (gaps.py --beat)">pause after commas <input type="range" id="beat" min="0.2" max="0.4" step="0.01" aria-label="pause after commas, seconds"> <b id="beatv"></b></span>
 <span id="taketotals"></span>
 <button id="send" class="send keep">send to Claude</button>
 <span id="saved" style="color:var(--ok)"></span> <span id="dirty" class="warn keep" hidden>changes not sent</span>
</header>
<main id="main"></main>
<div class="danger">wipes every ruling on this page (Ctrl+Z brings it back) <button id="reset">reset to proposed</button></div>
<script src="./board-client.js"></script>
<script>
// state and Send go through the editor boards; the reel comes from this page's own ?reel= (works inside the hub's iframe too)
const REEL = new URLSearchParams(location.search).get('reel') || '', BASE = '/videos/' + encodeURIComponent(REEL) + '/';
let bc = null; try { bc = BoardClient.create({board: 'cut-board'}); } catch (e) { bc = null; }
const reelUrl = p => BASE + String(p).split('/').map(encodeURIComponent).join('/');   // config paths are relative to the reel folder
let C, S, audio = {}, playing = null, openSil = null, openGap = null, lastWord = null, focus = 0;
const $ = s => document.querySelector(s);
// script, label, word, note and shot text is data, never markup (R4-01)
const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = t => `${Math.floor(t/60)}:${(t%60).toFixed(1).padStart(4,'0')}`;
const PRESETS = () => C.gap_presets;  // [[name, ms|null], ...]
// one word ("pause") and a unit on every value (UI audit T3)
const chipName = (n, ms) => ms == null ? n : /^\d+$/.test(String(n)) ? `${n} ms` : `${n} · ${ms} ms`;
const msLabel = v => v === 'default' ? `default (${S.gap_default_ms} ms)` : v == null ? 'as spoken' : `${v} ms`;

function seedRm(l){
  const rm={};
  l.attempts.forEach((a,j)=>{ const ids=a.words.filter(w=>a.sub_retakes.some(sr=>w.s>=sr.src_from-0.01&&w.s<sr.src_to-0.01)).map(w=>w.i); if(ids.length) rm[String(j)]=ids; });
  return rm;
}
function fresh(){
  return { v:2, reel:C.reel, gap_default_ms:C.gap_default_ms, speed:C.speed_default, beat_ms:C.beat_ms,
    // the board this ruling is made on, fixed when the ruling starts and never re-stamped at save (R1)
    word_list_hash:Object.fromEntries(Object.entries(C.takes).map(([n,t])=>[n,t.word_list_hash])), board_hash:C.board_hash,
    lines: C.lines.map(l => ({ id:l.id, pick:l.default, drop:l.default==null, flag:l.flag||null, note:'',
      gap_after:{mode:'default'}, shot:null, rm:seedRm(l), sil:{} })) };
}
function att(i){ const l=S.lines[i]; return l.pick==null?null:C.lines[i].attempts[l.pick]; }
function rmIntervals(a, rm){
  // runs of removed words -> [from, to) in source seconds: the removed word's in-point to the next kept word's in-point
  const out=[]; let run=null;
  a.words.forEach((w,n)=>{ const gone=rm.includes(w.i); if(gone&&run==null) run=n; if(!gone&&run!=null){ out.push([a.words[run].cin, w.cin]); run=null; } });
  if(run!=null) out.push([a.words[run].cin, a.src_out]);
  return out;
}
// seconds of silence k that survive its ruling (shared by the length stat and "play as cut")
function silKept(s,j,k,sv){ const ms=((s.sil||{})[j]||{})[k]; const cap= ms===undefined?S.gap_default_ms:ms; const len=sv.b-sv.a; return cap==null?len:Math.min(len,cap/1000); }
function lineDur(i){
  // speech kept in the picked read after drops, and the pauses it keeps after the rulings
  const a=att(i), s=S.lines[i]; if(!a||s.drop) return {speech:0, pauses:0};
  const j=String(s.pick);
  let d=a.src_out-a.src_in;
  const drops=rmIntervals(a,(s.rm||{})[j]||[]);
  drops.sort((x,y)=>x[0]-y[0]); let t=-1; drops.forEach(([x,y])=>{ const x2=Math.max(x,t); if(y>x2) d-=y-x2; t=Math.max(t,y); });
  let pauses=0;
  a.silences.forEach((sv,k)=>{
    if(drops.some(([x,y])=>sv.a>=x&&sv.b<=y)) return;           // inside a drop: gone anyway
    const len=sv.b-sv.a, kept=silKept(s,j,k,sv);
    d-=len-kept; pauses+=kept;
  });
  return {speech:d-pauses, pauses};
}
function gapMs(i){ const g=S.lines[i].gap_after; if(g.mode==='override') return g.ms; return S.gap_default_ms; }
function totals(){
  const kept=S.lines.map((l,i)=>i).filter(i=>!S.lines[i].drop&&att(i));
  let speech=0,pauses=0; kept.forEach(i=>{ const r=lineDur(i); speech+=r.speech; pauses+=r.pauses; });
  const live=kept.filter(i=>{ const r=lineDur(i); return r.speech+r.pauses>0.05; });   // a fully struck line emits no cut, so no gap after it (R4-03, matches selection_to_edl.py)
  live.forEach((i,k)=>{ if(k<live.length-1){ const g=gapMs(i); pauses+= g==null?0.6:g/1000; } });
  $('#len').textContent=fmt((speech+pauses)/S.speed); $('#gaps').textContent=pauses.toFixed(1)+'s'; $('#nl').textContent=kept.length+'/'+C.lines.length;
  const takes=new Set(live.map(i=>att(i).take)); $('#mix').hidden=takes.size<2;   // only lines that emit a cut count (R5-02)
}
function setPlayButtons(){ document.querySelectorAll('[data-play]').forEach(b=>{ const on=playing&&playing.key===b.dataset.play, lab=b.dataset.label; b.textContent=on?(lab?'■ stop':'■'):(lab||'▶'); b.classList.toggle('on',!!on); b.title=on?'stop':(lab?'play the picked read as it will be cut: struck words skipped, pauses at their ruled length (space)':'play this read as recorded'); }); }
// segs = [[from, to], ...] in source seconds. Checked every animation frame, so a stop lands within a frame
// instead of at the next ~0.25 s timeupdate (UI audit T3).
function playSegs(key, take, segs){
  if(playing&&playing.key===key){ stop(); return; } stop(); if(!segs.length) return;
  const el=audio[take]; let n=0;
  el.currentTime=segs[0][0]; el.preservesPitch=true; el.playbackRate=S.speed||1; el.play();   /* hear gaps at ship speed */
  const p=playing={el,key,raf:0};
  const check=()=>{ if(playing!==p) return; if(el.ended||el.currentTime>=segs[n][1]){ if(++n>=segs.length){ stop(); return; } el.currentTime=segs[n][0]; } };
  const loop=()=>{ check(); if(playing===p) p.raf=requestAnimationFrame(loop); };
  el.ontimeupdate=check;   // still fires in a background tab, where animation frames pause
  p.raf=requestAnimationFrame(loop); setPlayButtons();
}
function play(key,take,a,b){ playSegs(key,take,[[a,b]]); }
function stop(){ if(playing){ cancelAnimationFrame(playing.raf); playing.el.pause(); playing.el.ontimeupdate=null; playing=null; setPlayButtons(); } }
// "play as cut": the picked read minus struck-word runs, each pause shortened to its ruled length (same math as lineDur)
function cutSegs(i){
  const a=att(i), s=S.lines[i]; if(!a||s.drop) return [];
  const j=String(s.pick), drops=rmIntervals(a,(s.rm||{})[j]||[]), skip=drops.slice();
  a.silences.forEach((sv,k)=>{ if(drops.some(([x,y])=>sv.a>=x&&sv.b<=y)) return; const kept=silKept(s,j,k,sv); if(sv.b-sv.a-kept>0.005) skip.push([sv.a+kept, sv.b]); });
  skip.sort((x,y)=>x[0]-y[0]);
  const segs=[]; let t=a.src_in;
  skip.forEach(([x,y])=>{ if(x-t>0.01) segs.push([t,Math.min(x,a.src_out)]); t=Math.max(t,y); });
  if(a.src_out-t>0.01) segs.push([t,a.src_out]);
  return segs;
}
function playCut(i){ const a=att(i); if(a) playSegs('cut:'+i, a.take, cutSegs(i)); }
function chipRow(cur, data){ return `<span class="chips">${PRESETS().map(([n,ms])=>`<button data-${data} data-ms="${ms}" class="${cur===ms?'on':''}">${esc(chipName(n,ms))}</button>`).join('')}<button data-${data} data-ms="default" class="${cur==='default'?'on':''}">${msLabel('default')}</button></span>`; }
function silLabel(sv, ms){ const len=sv.b-sv.a; const cap= ms==='default'?S.gap_default_ms:ms; if(cap==null) return `keep ${len.toFixed(1)}s`; const kept=Math.min(len,cap/1000); return `✂ ${len.toFixed(1)}s → ${kept.toFixed(2)}s`; }

function attemptHTML(i, j, a, s, picked){
  const jj=String(j), rm=(s.rm||{})[jj]||[], silSt=(s.sil||{})[jj]||{};
  const silAfter={}; a.silences.forEach((sv,k)=>{ (silAfter[sv.after]=silAfter[sv.after]||[]).push([sv,k]); });
  let html='';
  a.words.forEach((w,n)=>{
    const gone=rm.includes(w.i);
    const prevGone=n>0&&rm.includes(a.words[n-1].i);
    const hard=!w.snapped&&((gone&&!prevGone)||(!gone&&prevGone));   // a cut boundary with no silence to sit in
    html+=`<span class="w${gone?' rm':''}${hard?' hard':''}" data-w="${i}:${j}:${w.i}" title="${hard?'no silence before this word: the cut lands mid-speech and gets waveform-checked at Stage 3 · ':''}${gone?'click to put this word back · shift-click puts back the run':'click to remove this word · shift-click removes the run'}">${esc(w.w)}</span> `;
    (silAfter[w.i]||[]).forEach(([sv,k])=>{
      const ms= silSt[k]===undefined?'default':silSt[k];
      const isOpen= openSil&&openSil[0]===i&&openSil[1]===j&&openSil[2]===k;
      html+=`<span class="sil${ms!=='default'?' on':''}${isOpen?' open':''}" data-sil="${i}:${j}:${k}" title="this pause is trimmed automatically - click to keep it or change the trim">${silLabel(sv,ms)}</span>`;
      if(isOpen) html+=chipRow(ms, `silset="${i}:${j}:${k}"`);
    });
  });
  return html;
}

// "changes not sent" = the board differs from the last Send (cut-selection.json), ignoring saved_at;
// before any Send, from how the board opened (UI audit #8)
const canon=o=>JSON.stringify(o,(k,v)=>{ if(k==='saved_at') return undefined; if(Array.isArray(v)) return v.every(x=>typeof x==='number')?[...v].sort((x,y)=>x-y):v; if(v&&typeof v==='object') return Object.fromEntries(Object.keys(v).sort().map(x=>[x,v[x]])); return v; });
let sentCanon=null, baseCanon=null;
function markDirty(){ const d=$('#dirty'); if(d) d.hidden= canon(S)===(sentCanon??baseCanon); }
function setSaved(msg, bad){ const el=$('#saved'); el.textContent=msg; el.style.color=bad?'var(--acc)':'var(--ok)'; el.classList.toggle('err',!!bad); }
// undo: in-memory snapshots taken at every save, newest last (UI audit E)
let hist=[], fut=[], snap=null, snapKey=null;
// cut-board.state.json on disk is the source of truth (any port, any browser); BoardClient keeps this browser's copy as the fallback
let diskT=null;
function persist(key){ const j=JSON.stringify(S);
  if(snap!=null&&j!==snap){ if(!(key&&key===snapKey)){ hist.push(snap); if(hist.length>50) hist.shift(); } fut=[]; snapKey=key||null; }   // typing one note is one undo step
  snap=j;
  clearTimeout(diskT); diskT=setTimeout(()=>bc.save(JSON.parse(j)).then(r=>{ if(!r.ok) setSaved(r.status?'AUTO-SAVE FAILED ('+r.status+'): only this browser has your changes':'AUTO-SAVE FAILED: no answer from the editor boards, only this browser has your changes',true); }),400);
  markDirty(); }
function restore(j){ S=JSON.parse(j); snap=j; openSil=openGap=null; bind(); render(); }
function undo(){ if(hist.length){ fut.push(snap); restore(hist.pop()); } }
function redo(){ if(fut.length){ hist.push(snap); restore(fut.pop()); } }
function setFocus(i, scroll){ focus=i; document.querySelectorAll('section.line').forEach(x=>x.classList.toggle('focus',+x.dataset.i===i)); if(scroll){ const x=document.querySelector(`section.line[data-i="${i}"]`); if(x) x.scrollIntoView({block:'nearest'}); } }
function render(first){
  if(first){ snap=JSON.stringify(S); markDirty(); } else persist();   // opening the board is not a change
  const m=$('#main'); m.innerHTML='';
  const top=document.createElement('div'); top.className='hint top';
  top.innerHTML='Click a word to remove it, click a struck word to put it back (shift-click does a whole run). ✂ chips are pauses already trimmed: click one to keep it as spoken or change it.<br><kbd>j</kbd> <kbd>k</kbd> next / previous line · <kbd>space</kbd> plays the picked read as cut · <kbd>1</kbd>-<kbd>9</kbd> picks that read · <kbd>d</kbd> drops or restores · <kbd>Ctrl</kbd>+<kbd>Z</kbd> undo · <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Z</kbd> redo · <kbd>Esc</kbd> stops';
  m.appendChild(top);
  C.lines.forEach((L,i)=>{
    const s=S.lines[i], d=document.createElement('section'); d.className='line'+(s.drop?' drop':'')+(i===focus?' focus':''); d.dataset.i=i;
    const kept=!s.drop&&att(i);
    d.innerHTML=`<h2><span class="id">${esc(L.id)}</span> ${esc(L.label)} <span style="margin-left:auto"></span>
      ${s.flag&&s.drop?`<span class="flag warn">${esc(s.flag)}</span>`:''}<button data-drop="${i}">${s.drop?'restore':'drop line'}</button></h2><div class="script">${esc(L.text)}</div>`;
    if(!L.attempts.length) d.innerHTML+=`<div class="warn">no attempt found in any take</div>`;
    L.attempts.forEach((a,j)=>{
      const on=s.pick===j, row=document.createElement('div'); row.className='att'+(on?' pick':'');
      row.innerHTML=`<div class="tag"><b>take ${a.take}</b> #${a.attempt}<br>${a.src_in.toFixed(2)}–${a.src_out.toFixed(2)}${a.snapped.every(x=>x)?'':' <span class="unsnap" title="some word edges in this read have no silence to sit in: a cut there lands mid-speech and gets waveform-checked at Stage 3">unsnapped</span>'}</div>
        <div class="txt">${attemptHTML(i,j,a,s,on)}${a.sub_retakes.length?`<div class="sub">repeated phrase: first read removed, last kept (${a.sub_retakes.map(sr=>(sr.src_to-sr.src_from).toFixed(1)+'s').join(', ')}) - click any word to put it back</div>`:''}</div>
        <div class="ctl"><button data-play="${i}:${j}">▶</button>${on&&kept?`<button data-play="cut:${i}" data-label="▶ as cut">▶ as cut</button>`:''}<button data-pick="${i}:${j}" class="${on?'on':''}">${on?'picked':'use'}</button></div>`;
      d.appendChild(row);
    });
    const nxt=C.lines.slice(i+1).findIndex((_,k)=>!S.lines[i+1+k].drop);
    if(kept&&nxt>=0){
      const g=document.createElement('div'); g.className='gap';
      const cur=s.gap_after.mode==='override'?s.gap_after.ms:'default', open=openGap===i;
      g.innerHTML=`pause after this line <span class="sil${cur!=='default'?' on':''}${open?' open':''}" data-gapopen="${i}" title="click to change the pause after this line">${msLabel(cur)}</span>${open?chipRow(cur, `gap="${i}"`):''}`;
      d.appendChild(g);
    }
    const f=document.createElement('div'); f.className='foot';
    f.innerHTML=`<span class="shot">shot <select data-shot="${i}"><option value="">↑ same as above</option>${C.shots.vocab.map(v=>`<option ${s.shot===v?'selected':''}>${esc(v)}</option>`).join('')}</select></span>
      <input placeholder="note" data-note="${i}" value="${esc(s.note)}">`;
    d.appendChild(f); m.appendChild(d);
  });
  totals(); setPlayButtons();
}
const msOf = v => v==='default' ? 'default' : (v==='null' ? null : +v);
document.addEventListener('click',e=>{
  const sec=e.target.closest('section.line'); if(sec&&+sec.dataset.i!==focus) setFocus(+sec.dataset.i,false);
  const w=e.target.closest('.w'); if(w){
    const [i,j,k]=w.dataset.w.split(':').map(Number); const s=S.lines[i];
    const a=C.lines[i].attempts[j]; const jj=String(j); const arr=s.rm[jj]||(s.rm[jj]=[]);
    const idx=a.words.findIndex(x=>x.i===k);
    if(e.shiftKey&&lastWord&&lastWord[0]===i&&lastWord[1]===j){
      // shift-click applies the clicked word's NEW state to the whole run: struck word -> the run comes back, kept word -> the run goes
      const from=Math.min(lastWord[2],idx), to=Math.max(lastWord[2],idx), removing=!arr.includes(k);
      for(let n=from;n<=to;n++){ const wi=a.words[n].i, p=arr.indexOf(wi); if(removing&&p<0) arr.push(wi); if(!removing&&p>=0) arr.splice(p,1); }
    } else { const p=arr.indexOf(k); if(p>=0) arr.splice(p,1); else arr.push(k); }
    lastWord=[i,j,idx]; render(); return;
  }
  const go=e.target.closest('[data-gapopen]'); if(go){ const i=+go.dataset.gapopen; openGap= openGap===i?null:i; render(); return; }
  const sil=e.target.closest('.sil'); if(sil){ const t=sil.dataset.sil.split(':').map(Number); openSil= openSil&&openSil.join(':')===t.join(':')?null:t; render(); return; }
  const b=e.target.closest('button'); if(!b) return; let v;
  if((v=b.dataset.play)){ if(v.startsWith('cut:')) playCut(+v.slice(4)); else { const [i,j]=v.split(':').map(Number), a=C.lines[i].attempts[j]; play(v,a.take,a.src_in,a.src_out); } }
  else if((v=b.dataset.pick)){ const [i,j]=v.split(':').map(Number); S.lines[i].pick=j; S.lines[i].drop=false; S.lines[i].flag=null; render(); }
  else if((v=b.dataset.drop)){ const s=S.lines[+v]; s.drop=!s.drop; if(!s.drop) s.flag=null; render(); }
  else if((v=b.dataset.gap)){ const ms=msOf(b.dataset.ms); S.lines[+v].gap_after= ms==='default'?{mode:'default'}:{mode:'override',ms}; openGap=null; render(); }
  else if((v=b.dataset.silset)){ const [i,j,k]=v.split(':').map(Number); const st=S.lines[i].sil[String(j)]||(S.lines[i].sil[String(j)]={}); const ms=msOf(b.dataset.ms); if(ms==='default') delete st[k]; else st[k]=ms; openSil=null; render(); }
  // every line on its last take-N read, un-dropped; a line with no take-N read is dropped and flagged, so Send never mixes takes
  else if((v=b.dataset.all)){ const n=+v; C.lines.forEach((L,i)=>{ const js=L.attempts.map((a,j)=>a.take===n?j:-1).filter(j=>j>=0), s=S.lines[i];
    if(js.length){ s.pick=js[js.length-1]; s.drop=false; s.flag=null; } else { s.drop=true; s.flag='not in take '+n; } }); render(); }
});
document.addEventListener('change',e=>{
  const t=e.target; let v;
  if((v=t.dataset.shot)!=null){ S.lines[+v].shot=t.value||null; persist(); }
  else if(t.id==='gapdef'){ S.gap_default_ms=+t.value; render(); }
  else if(t.id==='speed'){ S.speed=+t.value; persist(); totals(); }   // remembered and marked unsent like every other control (R5-03)
});
document.addEventListener('input',e=>{ if(e.target.id==='beat'){ S.beat_ms=Math.round(+e.target.value*1000); showBeat(); persist('beat'); return; }   // one drag is one undo step
  const v=e.target.dataset.note; if(v!=null){ S.lines[+v].note=e.target.value; persist('note:'+v); } });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ stop(); return; }
  const t=e.target; if(t.isContentEditable||/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)||!C) return;   // typing a note or using a dropdown
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&k==='z'){ e.preventDefault(); if(!e.repeat){ if(e.shiftKey) redo(); else undo(); } return; }
  if(e.ctrlKey||e.altKey||e.metaKey||e.repeat) return;
  if(k==='j'||k==='k') setFocus(Math.max(0,Math.min(C.lines.length-1,focus+(k==='j'?1:-1))),true);
  else if(k===' '){ e.preventDefault(); if(t.tagName==='BUTTON') t.blur(); playCut(focus); }
  else if(/^[1-9]$/.test(k)){ const j=+k-1; if(j<C.lines[focus].attempts.length){ S.lines[focus].pick=j; S.lines[focus].drop=false; S.lines[focus].flag=null; render(); } }
  else if(k==='d'){ const s=S.lines[focus]; s.drop=!s.drop; if(!s.drop) s.flag=null; render(); }
});
// two clicks within 3 s: one stray click can no longer wipe every ruling (UI audit #10)
let resetT=null;
$('#reset').onclick=()=>{ const b=$('#reset');
  if(!resetT){ b.textContent='click again to reset'; b.classList.add('arm'); resetT=setTimeout(()=>{ resetT=null; b.textContent='reset to proposed'; b.classList.remove('arm'); },3000); return; }
  clearTimeout(resetT); resetT=null; b.textContent='reset to proposed'; b.classList.remove('arm');
  S=fresh(); openSil=openGap=null; bind(); render(); };
$('#send').onclick=async()=>{
  const prev=S.saved_at; S.saved_at=new Date().toISOString();
  try{
    const r=await fetch(BASE+'__save?board=cut-board&name=cut-selection.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(S,null,1)});
    if(!r.ok) throw new Error('the board server answered '+r.status);
    sentCanon=canon(S); setSaved('saved cut-selection.json '+new Date().toLocaleTimeString()); markDirty();
  }catch(err){ S.saved_at=prev; setSaved('SEND FAILED: '+(err instanceof TypeError?'no answer from the editor boards (are they running?)':err.message)+'. Nothing reached Claude; your changes are still on this page.',true); }
};
function showBeat(){ $('#beatv').textContent=(S.beat_ms/1000).toFixed(2)+' s'; }
function bind(){
  $('#gapdef').innerHTML=PRESETS().filter(p=>p[1]!=null).map(([n,ms])=>`<option value="${ms}" ${ms===S.gap_default_ms?'selected':''}>${esc(chipName(n,ms))}</option>`).join('');
  $('#speed').innerHTML=C.speed_options.map(v=>`<option ${v===S.speed?'selected':''}>${v}</option>`).join('');
  $('#beat').value=(S.beat_ms/1000).toFixed(2); showBeat();
  const tk=Object.keys(C.takes);   // with one take "all take 1" does nothing (UI audit #9)
  $('#taketotals').innerHTML=tk.length>1?tk.map(t=>`<button data-all="${t}" title="every line on its last read from take ${t}; a line with no take-${t} read is dropped and flagged">all take ${t}</button>`).join(' '):'';
}
(bc?Promise.all([fetch(BASE+'cut-board.config.json').then(r=>{ if(!r.ok) throw new Error('no cut-board.config.json for this reel (HTTP '+r.status+')'); return r.json(); }), bc.load(),
  fetch(BASE+'cut-selection.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)]):Promise.reject(new Error('open this board with ?reel=<reel> in its address'))).then(([c,disk,sent])=>{
  C=c; $('#title').textContent='Cut Board · '+C.reel+' · '+C.rule;
  Object.values(C.takes).forEach(t=>{ const a=new Audio(reelUrl(t.wav)); a.preload='auto'; audio[t.n]=a; });
  S=fresh();
  try{ const st=disk; if(st){ const f=fresh();
    // restore only a ruling made on THIS board: a rebuilt board shifts word, attempt and silence indices (R1)
    if(st.reel===C.reel&&Array.isArray(st.lines)&&st.lines.length===f.lines.length&&st.board_hash&&st.board_hash===f.board_hash&&JSON.stringify(st.word_list_hash)===JSON.stringify(f.word_list_hash)){
      const lines=f.lines.map((fl,i)=>{ const o=Object.assign(fl, st.lines[i]||{}); const seed=seedRm(C.lines[i]); o.rm=o.rm||{}; Object.keys(seed).forEach(k=>{ if(!(k in o.rm)) o.rm[k]=seed[k]; }); return o; });   // seed only reads with no stored entry; never overwrite
      S=Object.assign(f, st, {lines}); S.lines.forEach((l,i)=>{ if(l.pick!=null&&!(l.pick<C.lines[i].attempts.length)) l.pick=C.lines[i].default; }); } else { const sv=$('#saved'); if(sv) sv.textContent='stored ruling was made on a different board: started fresh'; } } }catch(e){}
  // the last Send counts only if it was ruled on this board
  try{ if(sent){ const o=sent; if(o.reel===C.reel&&o.board_hash&&o.board_hash===C.board_hash) sentCanon=canon(o); } }catch(e){}
  baseCanon=canon(S);
  bind(); render(true);
}).catch(err=>{ $('#title').textContent='Cut Board: '+err.message; });
</script></body></html>
