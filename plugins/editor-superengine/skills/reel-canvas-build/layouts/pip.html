  Layout: pip (9:16). A partial for the editor-superengine compositor: compose.py reads it, it is not a page.
  Source: hyperframes-skills v0.8.184 (HeyGen, https://github.com/heygen-com/hyperframes),
    skills/talking-head-recut/references/layouts/pip.html
  Copyright 2026 HeyGen, Inc. Licensed under the Apache License 2.0; full text in LICENSES/Apache-2.0-HyperFrames.txt.
  That layout is itself adapted from notedit/vtake-skills (https://github.com/notedit/vtake-skills),
  MIT License, Copyright (c) 2026 leeoxiang (its full MIT text joins LICENSES/NOTICE at merge, H-S6b-24).
  Changed by REVXL: rewritten from the source's 1920x1080 demo page into this partial: only the portrait geometry from the
    source's notes is kept, as a card plate plus the a-roll box in data attributes; the source's 0.6 s tween
    of #video-wrap is replaced by compose.py setting the a-roll box hard on the cut frame (a move between cuts
    comes from styles.py); the card plate fills the frame and the video is the 9:16-source pill (738 28 312
    555, radius 14, the source's ring as the box shadow); compose.py paints the pill's box ABOVE the plate (z
    500 over the plate's 400) instead of relying on DOM order; plate #0a0c12.
  How compose.py reads it: every length is on the 1080x1920 grid and is scaled by (render width / 1080).
  data-box = the a-roll box (x y w h): the video sits inside it at object-fit: cover and is never animated itself.
  The card root is transparent; only the plate is filled.
-->
<div class="layout-card" data-layout="pip" data-box="738 28 312 555"
     data-box-radius="14" data-box-shadow="0 24px 60px -20px rgba(0, 0, 0, 0.45), 0 0 0 4px rgba(255, 255, 255, 0.7), 0 0 0 5px rgba(0, 0, 0, 0.18)"
     style="position: absolute; left: 0px; top: 0px; width: 1080px; height: 1920px; background: transparent;">
  <div class="layout-plate" style="position: absolute; left: 0px; top: 0px; width: 1080px; height: 1920px; background: #0a0c12;"></div>
</div>
