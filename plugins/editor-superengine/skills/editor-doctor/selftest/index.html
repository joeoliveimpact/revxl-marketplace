<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=540, height=960" />
    <script src="./vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 540px; height: 960px; overflow: hidden; background: #102030; }
      #main-root { position: relative; width: 100%; height: 100%; }
      #box { position: absolute; left: 0; top: 760px; width: 100px; height: 100px; background: #ff4d4f; }
      .host { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="main-root" data-composition-id="main" data-start="0" data-duration="2" data-fps="30" data-width="540" data-height="960">
      <div id="box" class="clip" data-start="0" data-duration="2" data-track-index="0"></div>
      <div id="scene-host" class="host clip" data-composition-id="scene" data-composition-src="compositions/scene.html" data-start="0" data-duration="2" data-track-index="1"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#box", { x: 0 }, { x: 440, duration: 2, ease: "none" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
