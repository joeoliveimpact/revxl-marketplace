              corners.push({ x: (point.x + 1) * 450, y: (1 - point.y) * h / 2 });
            }
          }
          return { left: Math.min(...corners.map(p => p.x)) - 16,
            right: Math.max(...corners.map(p => p.x)) + 16,
            top: Math.min(...corners.map(p => p.y)) - 16,
            bottom: Math.max(...corners.map(p => p.y)) + 16 };
        }
        function nearText(position, size, bounds) {
          const point = new THREE.Vector3(position.x, position.y, position.z).project(camera);
          const x = (point.x + 1) * 450, y = (1 - point.y) * h / 2;
          const radius = size * 0.5 * 1100 / (camera.position.z - position.z) + 48;
          return x + radius >= bounds.left && x - radius <= bounds.right
            && y + radius >= bounds.top && y - radius <= bounds.bottom;
        }
        let quarks = null, dustRenderer = null;
        // Only the library's synchronous simulation may consume this stream.
        // Bracket access permits the sanctioned random override without adding
        // an unseeded random call to our own scene code.
        function seeded(task) {
          let seed = Number(v.seed) >>> 0;
          const previous = Math["random"];
          Math["random"] = () => {
            let n = seed += 0x6D2B79F5;
            n = Math.imul(n ^ n >>> 15, n | 1);
            n ^= n + Math.imul(n ^ n >>> 7, n | 61);
            return ((n ^ n >>> 14) >>> 0) / 4294967296;
          };
          try { return task(); } finally { Math["random"] = previous; }
        }
        if (v.dust === "quarks") {
          const { ParticleSystem, BatchedRenderer, ConstantValue, ConstantColor, Vector4 } = await import("three.quarks");
          const image = document.createElement("canvas"); image.width = image.height = 64;
          const ctx = image.getContext("2d"), radial = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
          radial.addColorStop(0, "rgba(255,255,255,1)");
          radial.addColorStop(0.45, "rgba(255,255,255,0.7)");
          radial.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = radial; ctx.fillRect(0, 0, 64, 64);
          const dustMaterial = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(image),
            transparent: true, alphaTest: 0.005, depthTest: true, blending: THREE.AdditiveBlending });
          const tint = new THREE.Color(v.accent);
          const shape = { update() {}, initialize(particle) {
            const rand = Math["random"];
            const front = rand() < 0.22;
            const z = front ? 160 + rand() * 120 : -360 - rand() * 1100;
            const scale = (1100 - z) / 1100;
            // Leave foreground light around the text exclusion, inside the band.
            particle.position.set((rand() - 0.5) * (front ? 860 : 790) * scale,
              (rand() - 0.5) * (h - (front ? 30 : 70)) * scale, z);
            particle.velocity.set((rand() - 0.5) * 22 * scale, (rand() - 0.5) * 12 * scale, front ? -20 : 18);
            const size = (front ? 14 + rand() * 12 : 7 + rand() * 12) * scale;
            particle.startSize.set(size, size, size); particle.size.copy(particle.startSize);
            const bright = rand() < 0.3 ? 3.5 : 1.2;
            particle.startColor.set((0.8 + tint.r * 0.2) * bright, (0.8 + tint.g * 0.2) * bright,
              (0.8 + tint.b * 0.2) * bright, front ? 0.32 : 0.22);
            particle.color.copy(particle.startColor);
          } };
          quarks = seeded(() => new ParticleSystem({ duration: 9, looping: false,
            startLife: new ConstantValue(12), startSpeed: new ConstantValue(0),
            startSize: new ConstantValue(1), startColor: new ConstantColor(new Vector4(1, 1, 1, 1)),
            emissionOverTime: new ConstantValue(0), emissionBursts: [{ time: 0, count: new ConstantValue(260), cycle: 1, interval: 0.1, probability: 1 }],
            shape, material: dustMaterial, renderOrder: 1 }));
          scene.add(quarks.emitter); dustRenderer = new BatchedRenderer();
          scene.add(dustRenderer); dustRenderer.addSystem(quarks); points.visible = false;
        }
        // Bloom has no temporal effects. Supply the delta explicitly so the
        // composer's internal clock cannot affect a seek or a cold render.
        const { EffectComposer, RenderPass, EffectPass, BloomEffect, DepthOfFieldEffect,
          ToneMappingEffect, ToneMappingMode } = await import("postprocessing");
        const composer = new EffectComposer(renderer, { frameBufferType: THREE.HalfFloatType });
        composer.addPass(new RenderPass(scene, camera));
        const dof = new DepthOfFieldEffect(camera, { focusDistance: 1088, focusRange: 180, bokehScale: 7, resolutionScale: 1 });
        composer.addPass(new EffectPass(camera, dof));
        if (v.glow === "bloom") {
          composer.addPass(new EffectPass(camera, new BloomEffect({
            intensity: 1.5, luminanceThreshold: 1, luminanceSmoothing: 0.3,
            mipmapBlur: true, radius: 0.7
          })));
        }
        // ACES filmic rolls off bright bloom while retaining the blue accent;
        // map only once, after depth blur and bloom, with no adaptive history.
        composer.addPass(new EffectPass(camera, new ToneMappingEffect({ mode: ToneMappingMode.ACES_FILMIC })));
        composer.setSize(900, h);
        root.dataset["3dGlow"] = v.glow;
        root.dataset["3dDust"] = quarks ? "quarks" : "points";
        root.dataset["3dFocus"] = "depth-of-field";
        a.draw = function (t) {
          // The glow is shared; only the card and dust swap drawing paths.
          a.drawCSS(t);
          if (failed) return;
          const p = a.pose(t);
          camera.position.z = 1100 - p.z;
          slabMesh.rotation.set(THREE.MathUtils.degToRad(-p.rx), THREE.MathUtils.degToRad(p.ry), 0, "YXZ");
          material.opacity = p.opacity; edgeMaterial.opacity = p.opacity * 0.48;
          textGroup.quaternion.copy(slabMesh.quaternion); textMaterial.opacity = p.opacity;
          rim.material.opacity = accentMaterial.opacity = p.opacity;
          const duration = Number(root.dataset.duration);
          const lateStart = Math.max(1.5, duration - 0.85);
          const firstSweep = t >= 0.5 && t <= 1.4;
          const sweepTime = firstSweep ? (t - 0.5) / 0.9 : (t - lateStart) / 0.7;
          sweepMaterial.uniforms.progress.value = Math.min(1, Math.max(0, sweepTime));
          sweepMaterial.uniforms.strength.value = sweepTime >= 0 && sweepTime <= 1
            ? Math.sin(Math.PI * sweepTime) * (firstSweep ? 0.58 : 0.24) * p.opacity : 0;
          dof.cocMaterial.focusDistance = camera.position.z - 12;
          if (quarks) seeded(() => {
            quarks.restart(); quarks.emitter.updateWorldMatrix(true, false);
            quarks.update(0);
            const fps = Number(root.dataset.fps), steps = Math.floor(t * fps + 1e-7);
            for (let i = 0; i < steps; i++) quarks.update(1 / fps);
            const remainder = t - steps / fps;
            if (remainder > 1e-7) quarks.update(remainder);
            const bounds = textBounds();
            for (let i = 0; i < quarks.particleNum; i++) {
              const particle = quarks.particles[i];
              // Cull the complete sprite plus optical halo before it reaches text.
              // Far dust is faint everywhere, and absent under the text box too.
              const covered = nearText(particle.position, Math.max(particle.size.x, particle.size.y), bounds);
              particle.color.w *= covered ? 0 : p.opacity;
            }
            dustRenderer.update(0);
            // The library defaults transparent sprites to no depth writes.
            // Write their cutout depth so postprocessing sees front AND far dust.
            for (const batch of dustRenderer.batches) batch.material.depthWrite = true;
          });
          dots.uniforms.alpha.value = p.opacity;
          a.particles.forEach((dot, i) => {
            const d = a.dustAt(dot, t);
            positions[i * 3] = d.x; positions[i * 3 + 1] = -d.y; positions[i * 3 + 2] = d.z;
          });
          geo.attributes.position.needsUpdate = true;
          try {
            composer.render(0);
            renderer.autoClear = false; renderer.clearDepth(); renderer.render(textScene, camera);
          }
          catch (_) { fallback(); }
          finally { renderer.autoClear = true; }
        };
        renderer.compile(scene, camera);
        if (failed || renderer.getContext().isContextLost()) { fallback(); return; }
        probeFrame();
        if (failed) return;
        a.sync(window.__hfThreeTime ?? a.state.t);
        if (failed) return;
        root.dataset["3dPath"] = "webgl";
        slab.style.visibility = "hidden";
        document.getElementById("dust").style.visibility = "hidden";
        canvas.style.visibility = "visible";
      }
      try { await build().catch(() => fallback()); }
      finally { loading.itemsLoaded = 1; loading.itemEnd("glass-card-setup"); }
    </script>
