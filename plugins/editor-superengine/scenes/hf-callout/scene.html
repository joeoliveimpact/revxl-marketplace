<!doctype html>
<!-- Adapted from HyperFrames registry/blocks/mk-callout-highlight (https://github.com/heygen-com/hyperframes, tag v0.8.184, d15a274c), Apache License 2.0, Copyright 2026 HeyGen, Inc. Modified by editor-superengine: portrait 1080x1920, local GSAP 3.15.0, Inter 400, scene contract. -->
<html lang="en" data-composition-variables='[
  {"id":"text","type":"string","label":"Sentence","default":"Functionality was our goal from the very beginning"},
  {"id":"sweep","type":"number","label":"Sweep seconds","default":2.4},
  {"id":"accent","type":"color","label":"Accent","default":"#f5f5f7"},
  {"id":"font","type":"string","label":"Font family","default":"Inter"},
  {"id":"top","type":"number","label":"Sentence centre","default":845},
  {"id":"size","type":"number","label":"Sentence font size","default":72}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="./vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; src: url("./fonts/Inter-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; }
      #hf-callout { position: relative; width: 1080px; height: 1920px; z-index: 400; font-family: "Inter"; font-weight: 400; color: #f5f5f7; --accent: #f5f5f7; }
      #hf-callout .box { position: absolute; left: 90px; top: 845px; width: 840px; font-size: 72px; line-height: 1.3; letter-spacing: -0.015em; text-align: left; color: var(--accent); overflow-wrap: anywhere; }
      #hf-callout .word { display: inline; opacity: 0.32; }
    </style>
  </head>
  <body>
    <div id="hf-callout" data-composition-id="hf-callout" data-start="0" data-duration="4" data-fps="30" data-width="1080" data-height="1920">
      <div class="box slot" data-slot="text"></div>
    </div>
    <script>
      (function () {
        const v = window.__hyperframes.getVariables();
        const root = document.getElementById("hf-callout");
        const box = root.querySelector('[data-slot="text"]');
        box.style.top = v.top + "px";
        box.style.fontSize = v.size + "px";
        root.style.setProperty("--accent", v.accent);
        root.style.fontFamily = JSON.stringify(v.font);
        // One span per word, so the sweep can lift each word from faint to full in turn.
        const words = String(v.text).split(/\s+/).filter(Boolean).map((w, i) => {
          if (i > 0) box.appendChild(document.createTextNode(" "));
          const span = document.createElement("span");
          span.className = "word";
          span.textContent = w;
          box.appendChild(span);
          return span;
        });
        // GSAP sets the highlight amount (0..1) through this getter/setter while it renders, so a seek to any
        // frame shows that frame's sweep. Each word goes from 0.32 to full opacity as the sweep crosses it.
        const sweep = { p: function (x) {
          if (x === undefined) return this._p;
          this._p = x;
          const k = x * words.length;
          words.forEach((el, i) => { el.style.opacity = String(0.32 + 0.68 * Math.max(0, Math.min(1, k - i))); });
        } };
        sweep.p(0);
        const secs = Math.max(0.5, Math.min(7, Number(v.sweep) || 2.4));
        const tl = gsap.timeline({ paused: true });
        tl.set(box, { yPercent: -50 }, 0);
        tl.fromTo(box, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0);
        tl.fromTo(sweep, { p: 0 }, { p: 1, duration: secs, ease: "none" }, 0.8);
        window.__timelines = window.__timelines || {};
        window.__timelines["hf-callout"] = tl;
      })();
    </script>
  </body>
</html>
