<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"Three quick tips"},
  {"id":"item1","type":"string","label":"Item 1","default":"Start with the problem"},
  {"id":"item2","type":"string","label":"Item 2","default":"Show one clear example"},
  {"id":"item3","type":"string","label":"Item 3 (empty hides it)","default":"End with the next step"},
  {"id":"accent","type":"color","label":"Accent","default":"#4f8cff"},
  {"id":"font","type":"string","label":"Font family","default":"Inter"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="./vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; src: url("./fonts/Inter-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; }
      #list { position: relative; width: 1080px; height: 1920px; z-index: 400; font-family: "Inter"; font-weight: 400; color: #ffffff; --accent: #4f8cff; }
      #list .panel { position: absolute; left: 80px; top: 500px; width: 840px; padding: 40px 40px 44px; border-radius: 28px; background: rgba(12, 14, 18, 0.84); }
      #list .title { display: block; margin-bottom: 28px; font-size: 58px; line-height: 1.15; color: var(--accent); overflow-wrap: anywhere; }
      #list .row { position: relative; padding-left: 44px; margin-top: 24px; }
      #list .dot { position: absolute; left: 0; top: 18px; width: 20px; height: 20px; border-radius: 5px; background: var(--accent); }
      #list .item { display: block; font-size: 46px; line-height: 1.2; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <div id="list" data-composition-id="list" data-start="0" data-duration="4" data-fps="30" data-width="1080" data-height="1920">
      <div class="panel plate">
        <span class="title slot" data-slot="title"></span>
        <div class="row"><div class="dot plate"></div><span class="item slot" data-slot="item1"></span></div>
        <div class="row"><div class="dot plate"></div><span class="item slot" data-slot="item2"></span></div>
        <div class="row"><div class="dot plate"></div><span class="item slot" data-slot="item3"></span></div>
      </div>
    </div>
    <script>
      (function () {
        const v = window.__hyperframes.getVariables();
        const root = document.getElementById("list");
        root.style.setProperty("--accent", v.accent);
        root.style.fontFamily = JSON.stringify(v.font);
        root.querySelectorAll("[data-slot]").forEach((el) => { el.textContent = v[el.dataset.slot]; });
        const rows = Array.from(root.querySelectorAll(".row"));
        rows.forEach((r) => { if (r.querySelector(".item").textContent === "") r.style.display = "none"; });
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(root.querySelector(".panel"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0);
        tl.fromTo(root.querySelector(".title"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.15);
        rows.forEach((r, i) => {
          tl.fromTo(r, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 0.45 + 0.35 * i);
        });
        window.__timelines = window.__timelines || {};
        window.__timelines["list"] = tl;
      })();
    </script>
  </body>
</html>
