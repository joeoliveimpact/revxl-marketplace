name: Validate Plugins

# CI runs the SAME script contributors run locally: scripts/validate.py
# (run `python scripts/validate.py` before pushing). Keeping the logic in
# one committed file means CI and local can never drift.
#
# All SEVEN sections run here (five as of 2026-09-01, routing added 2026-09-08,
# changelog added 2026-10-06).
# Before that CI ran only three, so plugin_integrity and readme were local-only
# ... which meant an error the script was fully capable of raising could never
# fail a PR. If you add a section to scripts/validate.py, add a job for it here
# in the same change.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-marketplace:
    runs-on: ubuntu-latest
    name: Validate marketplace.json schema
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate.py --section marketplace

  validate-plugins:
    runs-on: ubuntu-latest
    name: Validate each plugin's structure
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate.py --section plugins

  validate-skill-frontmatter:
    runs-on: ubuntu-latest
    name: Validate SKILL.md frontmatter
    steps:
      - uses: actions/checkout@v4
      - name: Install pyyaml
        run: pip install pyyaml
      - run: python3 scripts/validate.py --section frontmatter

  validate-plugin-integrity:
    runs-on: ubuntu-latest
    name: Validate plugin integrity (incl. the 5000-token SKILL.md ceiling)
    steps:
      - uses: actions/checkout@v4
      - name: Install pyyaml
        run: pip install pyyaml
      - run: python3 scripts/validate.py --section plugin_integrity

  validate-readme:
    runs-on: ubuntu-latest
    name: Validate README catalog matches the manifests
    steps:
      - uses: actions/checkout@v4
      - name: Install pyyaml
        run: pip install pyyaml
      - run: python3 scripts/validate.py --section readme

  validate-changelog:
    runs-on: ubuntu-latest
    name: Validate catalog number is new + CHANGELOG tops match manifests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the check compares against origin/main
      - run: python3 scripts/validate.py --section changelog

  validate-routing:
    runs-on: ubuntu-latest
    name: Validate routing (no dead ends, shortform-superengine)
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate.py --section routing
